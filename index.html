举牌接机，入住宪法广场精品酒店。傍晚漫步普拉卡石板巷，晚餐安排屋顶餐厅远眺卫城夜景，附赠气泡酒。`],[`D2`,`雅典卫城 · 宪法广场换岗 · 利卡贝托山日落`,`上午深度游览卫城与卫城博物馆（含中文讲解），下午看整点换岗仪式，黄昏乘缆车登利卡贝托山看全城日落。`],[`D3`,`飞抵圣托里尼 · 入住悬崖酒店 · 费拉小镇`,`早班机直飞圣岛，免去 8 小时轮渡，专车接至伊亚悬崖酒店。下午自由探索费拉蓝顶教堂与悬崖步道，预留日落房型。`],[`D4`,`爱琴海双体船出海 · 火山温泉 · 船上日落晚宴`,`午后登双体船巡游火山岛、红沙滩浮潜、火山温泉泡汤，船上 BBQ 晚餐配圣岛葡萄酒，在甲板上迎接爱琴海日落。`],[`D5`,`伊亚清晨旅拍 · 酒庄品鉴 · 送机返程`,`清晨无人时段进行 1 小时旅拍，中午圣岛百年酒庄品鉴 Assyrtiko，专车送机。可延住升级 7 天行程。`]],summary:[[`天数`,`5 天 4 晚（可延住升级 7 天）`],[`起止`,`雅典进出，含内陆航班`],[`适合`,`蜜月 / 情侣 / 纪念日，2 人成行`],[`包含`,`酒店 · 司导 · 内陆机票 · 出海 · 部分餐食`]]},{slug:`family-7d`,days:`7 天 6 晚`,kicker:`雅典 · 伯罗奔尼撒`,title:`经典三城家庭游`,tags:`亲子 · 家庭 · 闺蜜`,desc:`神话遗迹、海滨古城与在地美食，兼顾不同年龄的节奏与兴趣。`,image:F.corinth,eyebrow:`7 DAYS · ATHENS + PELOPONNESE`,destinations:[`athens`,`nafplio`],intro:`把雅典的博物馆与伯罗奔尼撒的神话遗迹串成一条线：每天车程控制在两小时内，孩子看城堡、大人逛老城，节奏松紧由家庭自己定。`,itinerary:[[`D1`,`抵达雅典 · 专人接机 · 宪法广场周边适应时差`,`华人司导举牌接机，入住适合家庭的公寓式酒店。傍晚在宪法广场看换岗、国家花园散步，早睡倒时差。`],[`D2`,`雅典卫城 · 卫城博物馆 · 普拉卡亲子寻宝`,`上午深度游览卫城与卫城博物馆，下午在普拉卡老城进行亲子寻宝游戏（定制任务卡），晚餐安排希腊烤肉家庭餐。`],[`D3`,`科林斯运河 · 纳夫普利翁 · 帕拉米迪城堡`,`驱车跨越科林斯运河，抵达海边老城纳夫普利翁。乘车上帕拉米迪城堡俯瞰海湾，傍晚老城自由漫步与冰淇淋时间。`],[`D4`,`迈锡尼遗址 · 埃皮达鲁斯古剧场`,`上午探秘狮子门与阿伽门农墓（希腊神话现场课），下午到埃皮达鲁斯古剧场测试传声奇迹，孩子可在剧场中心朗读体验。`],[`D5`,`波罗斯岛跳岛 · 海鲜午餐 · 海滩下午`,`从加拉塔斯乘船 10 分钟登波罗斯岛，岛上钟楼与柠檬林漫步，海鲜午餐后安排海滩自由活动与游泳。`],[`D6`,`返回雅典 · 利卡贝托山日落 · 告别晚宴`,`上午返回雅典，下午乘缆车登利卡贝托山看全城日落，晚上安排普拉卡告别晚宴与民俗歌舞表演。`],[`D7`,`国家考古博物馆 · 送机返程`,`上午在国家考古博物馆看阿伽门农黄金面具（衔接迈锡尼行程），专车送机返程。`]],summary:[[`天数`,`7 天 6 晚`],[`起止`,`雅典进出，伯罗奔尼撒环线`],[`适合`,`亲子 / 家庭 / 闺蜜，4 人成行`],[`包含`,`酒店 · 司导 · 门票 · 跳岛船票 · 部分餐食`]]},{slug:`heritage-9d`,days:`9 天 8 晚`,kicker:`全遗产环游`,title:`希腊全遗产深度环游`,tags:`深度 · 私人定制 · 文化爱好者`,desc:`从雅典到德尔斐、梅黛奥拉，跟着中文向导读懂古典希腊。`,image:F.delphi,eyebrow:`9 DAYS · UNESCO HERITAGE TOUR`,destinations:[`athens`,`delphi`,`meteora`],intro:`一条为文化爱好者设计的深度环线：雅典、德尔斐、梅黛奥拉三大世界遗产全收录，全程中文向导随行讲解，把神话与历史讲成故事。`,itinerary:[[`D1`,`抵达雅典 · 专人接机 · 老城欢迎晚宴`,`华人司导举牌接机，入住宪法广场周边精品酒店，傍晚普拉卡老城漫步与屋顶餐厅欢迎晚宴。`],[`D2`,`雅典卫城 · 卫城博物馆 · 古代市集`,`全天雅典考古核心：卫城、卫城博物馆与古代市集（含中文向导讲解），梳理古典雅典的城市脉络。`],[`D3`,`德尔斐 · 阿波罗神庙 · 阿拉霍瓦小镇`,`驱车沿帕纳索斯山抵达"世界中心"德尔斐，游览阿波罗神庙、宝库与古剧场，傍晚宿山脚小镇阿拉霍瓦。`],[`D4`,`梅黛奥拉 · 悬空修道院（上）`,`前往卡兰巴卡，游览梅黛奥拉两座修道院（大梅黛奥拉与瓦尔拉姆），黄昏在观景台看石柱群光影。`],[`D5`,`梅黛奥拉 · 悬空修道院（下）· 返回雅典`,`清晨再访圣三一修道院（007 取景地），午后驱车返回雅典，晚上自由休整。`],[`D6`,`国家考古博物馆 · 凯拉米克斯遗址`,`上午国家考古博物馆精讲（青铜车夫像与基克拉泽斯雕像），下午凯拉米克斯古城墙遗址。`],[`D7`,`苏尼翁角 · 波塞冬神庙日落`,`上午自由活动或卫城补拍，黄昏驱车至阿提卡最南端苏尼翁角，在波塞冬神庙看爱琴海日落。`],[`D8`,`埃伊纳岛一日跳岛 · 阿菲亚神庙`,`乘船登埃伊纳岛，游览保存最完好的阿菲亚神庙，品尝岛上开心果甜品，傍晚返回雅典。`],[`D9`,`自由活动 · 专车送机返程`,`根据航班时间自由活动或补购手信，专车送机，结束九天古典希腊深度环游。`]],summary:[[`天数`,`9 天 8 晚`],[`起止`,`雅典进出，含德尔斐与梅黛奥拉`],[`适合`,`深度游 / 文化爱好者 / 银发慢游`],[`包含`,`酒店 · 司导 · 中文向导 · 全部门票 · 早餐`]]}],Gi=[{slug:`athens`,name:`雅典`,en:`ATHENS`,type:`culture`,image:F.athens,eyebrow:`ATHENS · ATTICA`,headline:`西方文明的起点，也是一座活着的城市`,intro:[`雅典不只是卫城的明信片。2500 年的帕特农神庙、宪法广场的换岗仪式、普拉卡石板巷里的手风琴声，与 Ermou 街的现代生活叠在同一座城市里。`,`我们会为你安排中文讲解的卫城深度游、避开人流的清晨时段，以及本地人才知道的屋顶餐厅与老城酒馆。`],facts:[[`最佳时间`,`3–11 月`],[`建议停留`,`2–3 天`],[`抵达方式`,`国际直飞雅典机场`]],routes:[`athens-3d`,`honeymoon-5d`,`family-7d`,`heritage-9d`]},{slug:`delphi`,name:`德尔斐`,en:`DELPHI`,type:`culture`,image:F.delphi,eyebrow:`DELPHI · PARNASSUS`,headline:`古人眼中的世界中心，帕纳索斯山上的神谕之地`,intro:[`古希腊人相信德尔斐是世界的中心（Omphalos），阿波罗神庙的女祭司在此传达神谕，各城邦的宝库至今立在圣路两侧。`,`从雅典出发两小时车程，建议与阿拉霍瓦小镇和奥斯·卢卡斯修道院串成一日或两日环线，黄昏时分古剧场的视野最好。`],facts:[[`最佳时间`,`4–10 月`],[`建议停留`,`1–2 天`],[`抵达方式`,`雅典驱车 2.5 小时`]],routes:[`heritage-9d`]},{slug:`meteora`,name:`梅黛奥拉`,en:`METEORA`,type:`culture`,image:F.meteoraSquare,eyebrow:`METEORA · THESSALY`,headline:`悬在石柱之巅的修道院群，中世纪修士的天空之城`,intro:[`数百万年风化形成的巨型石柱上，14 世纪起修士们用绳索与吊篮运石建院，鼎盛时期 24 座修道院悬于半空，如今仍有 6 座开放。`,`我们安排清晨与黄昏两个观景时段，避开旅行团高峰，并可搭配卡兰巴卡小镇住宿，体验石柱群在晨雾中的样子。`],facts:[[`最佳时间`,`4–10 月`],[`建议停留`,`1–2 天`],[`抵达方式`,`雅典驱车 4 小时或火车`]],routes:[`heritage-9d`]},{slug:`nafplio`,name:`纳夫普利翁`,en:`NAFPLIO`,type:`culture`,image:F.nafplio,eyebrow:`NAFPLIO · PELOPONNESE`,headline:`希腊人自己的度假后花园，威尼斯风情的老城海港`,intro:[`纳夫普利翁曾是希腊第一个现代首都：老城的威尼斯城堡、海中的布尔齐要塞与山上的帕拉米迪 999 级台阶，构成最上镜的海港天际线。`,`这里是伯罗奔尼撒环线的最佳落脚点，步行可达一切，傍晚在海堤散步是本地人的日常。`],facts:[[`最佳时间`,`4–10 月`],[`建议停留`,`2–3 天`],[`抵达方式`,`雅典驱车 1.5 小时`]],routes:[`family-7d`]},{slug:`santorini
